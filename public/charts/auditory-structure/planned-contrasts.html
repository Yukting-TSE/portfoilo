<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>错误与恢复离开零，时间与负荷没有</title>
<style>
  :root{
    --bg:#F7F2EB;
    --ink:#081F5C;
    --muted:rgba(8,31,92,.60);
    --faint:rgba(8,31,92,.32);
    --grid:rgba(8,31,92,.16);
    --sans:"HelveticaNowDisplay-Medium","Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);border-radius:24px}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .card,svg{width:100%;height:100%;display:block;background:var(--bg)}
  svg text{font-family:var(--sans);user-select:none}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .fade{animation:none}
  }
</style>
</head>
<body>
<div class="card">
  <svg id="tickrows" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet"></svg>
</div>
<script>
(function () {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  /* Porcelain 纸底与青瓷蓝阶；Wire 只给一个主角，橙改成天蓝。 */
  const PAPER = '#F7F2EB';
  const INK = '#081F5C';
  const DATA = '#334EAC';
  const MUTED = 'rgba(8,31,92,.60)';
  const FAINT = 'rgba(8,31,92,.32)';
  const GRID = 'rgba(8,31,92,.16)';
  const FAINTDATA = '#BAD6EB';
  const HERO = '#1BA3DC';
  const rnd = (i, k) => Math.abs(((i * 73856093) ^ (k * 19349663)) % 1000) / 1000;
  const el = (p, t, a) => { const n = document.createElementNS(NS, t);
    for (const k in a) n.setAttribute(k, a[k]); p.appendChild(n); return n; };
  const txt = (p, a, s) => { const n = el(p, 'text', a); n.textContent = s; return n; };
  const tip = (n, s) => { const t = document.createElementNS(NS, 'title');
    t.textContent = s; n.appendChild(t); };

  /* F5 Tick Rows · basics-gallery.html · "Six teams, shipped and counted"
     一行 = 一次计划对比。从无差异出发的竖线队列是点估计。
     1 tick = .01（率）/ 2s（时间）/ 0.2（NASA-TLX）。
     tick 高度/透明度抖动，每 5 根一个点标，行尾大数。
     淡轨 = 95% 区间。青瓷蓝 = 区间不含零；天蓝 = 主对比 C3 − C2。 */
  const PANELS = [
    {
      name: '错误率',
      unit: 0.01, kind: 'rate',
      lo: -0.36, hi: 0.06,
      rows: [
        ['C3 − C2', -0.146227, -0.200942, -0.091513],
        ['C3 − C1', -0.228824, -0.314744, -0.142904],
        ['C2 − C1', -0.082596, -0.163523, -0.001669]
      ]
    },
    {
      name: '纠正率',
      unit: 0.01, kind: 'rate',
      lo: -0.16, hi: 0.38,
      rows: [
        ['C3 − C2', 0.168406, 0.080168, 0.256644],
        ['C3 − C1', 0.17663, 0.009551, 0.343708],
        ['C2 − C1', 0.008223, -0.107886, 0.124333]
      ]
    },
    {
      name: '完成时间',
      unit: 2, kind: 'sec',
      lo: -32, hi: 56,
      rows: [
        ['C3 − C2', 19.547842, -10.963659, 50.059343],
        ['C3 − C1', 9.254816, -25.375159, 43.884791],
        ['C2 − C1', -10.293026, -29.989199, 9.403147]
      ]
    },
    {
      name: 'NASA-TLX',
      unit: 0.2, kind: 'tlx',
      lo: -7.2, hi: 4.4,
      rows: [
        ['C3 − C2', -0.368947, -4.615908, 3.878013],
        ['C3 − C1', -1.412895, -6.109882, 3.284093],
        ['C2 − C1', -1.043947, -3.757624, 1.66973]
      ]
    }
  ];

  const fmt = (v, kind) => {
    const sign = v > 0 ? '+' : v < 0 ? '−' : '';
    const a = Math.abs(v);
    if (kind === 'rate') return sign + a.toFixed(3).replace(/^0/, '');
    if (kind === 'sec') return sign + a.toFixed(1) + 's';
    return sign + a.toFixed(2);
  };

  const s = document.getElementById('tickrows');
  el(s, 'rect', { x: 0, y: 0, width: 960, height: 540, fill: PAPER });
  const g = el(s, 'g', { id: 'plot' });

  /* 2×2 铺满画布；画完后只平移，让墨迹四边留白相同，不缩小。 */
  const VW = 960, VH = 540, pad = 22;
  const CW = (VW - pad * 2) / 2, CH = (VH - pad * 2) / 2;
  PANELS.forEach((panel, pi) => {
    const ox = pad + (pi % 2) * CW;
    const oy = pad + Math.floor(pi / 2) * CH;
    const LX = ox + 8;
    const X0 = ox + 84, X1 = ox + CW - 6;
    const y0 = (i) => oy + 76 + i * ((CH - 100) / 2);
    const mapX = (v) => X0 + (v - panel.lo) / (panel.hi - panel.lo) * (X1 - X0);
    const zx = mapX(0);
    const PX = Math.abs(mapX(panel.unit) - zx);

    txt(g, { x: LX, y: oy + 26, 'font-size': 20, 'font-weight': 700, fill: INK,
      class: 'fade', style: `animation-delay:${pi * 0.06}s` }, panel.name);

    el(g, 'line', { x1: zx, y1: oy + 52, x2: zx, y2: y0(2) + 18,
      stroke: 'rgba(8,31,92,.28)', 'stroke-width': 2.2,
      class: 'fade', style: `animation-delay:${pi * 0.06}s` });
    txt(g, { x: zx, y: oy + 46, 'font-size': 11, 'font-weight': 700, fill: MUTED,
      'text-anchor': 'middle',
      style: `paint-order:stroke;stroke:${PAPER};stroke-width:5px;animation-delay:${pi * 0.06}s`,
      class: 'fade' }, '无差异');

    panel.rows.forEach((row, i) => {
      const [name, est, lo, hi] = row;
      const y = y0(i);
      const xa = mapX(lo), xb = mapX(hi);
      const sig = lo > 0 || hi < 0;
      const hero = name === 'C3 − C2' && sig;
      const ink = hero ? HERO : sig ? DATA : FAINTDATA;
      const n = Math.max(0, Math.round(Math.abs(est) / panel.unit));
      const dir = est < 0 ? -1 : 1;

      txt(g, { x: LX, y: y + 4, 'font-size': 14, 'font-weight': 700, fill: MUTED,
        class: 'fade', style: `animation-delay:${pi * 0.06 + i * 0.08}s` }, name);

      el(g, 'line', { x1: X0, y1: y + 10, x2: X1, y2: y + 10, stroke: GRID, 'stroke-width': 1.4,
        class: 'fade', style: `animation-delay:${pi * 0.06 + i * 0.08}s` });
      el(g, 'line', { x1: xa, y1: y + 10, x2: xb, y2: y + 10, stroke: FAINTDATA, 'stroke-width': 4.2,
        class: 'fade', style: `animation-delay:${pi * 0.06 + i * 0.08}s` });

      for (let k = 0; k < n; k++) {
        const x = zx + dir * (k * PX + PX / 2);
        const h = 15 + rnd(k + 1, pi * 3 + i + 2) * 9;
        el(g, 'line', {
          x1: x, y1: y + 10, x2: x, y2: y + 10 - h,
          stroke: ink, 'stroke-width': hero ? 3.2 : 2.7,
          opacity: 0.85 + rnd(k + 3, pi * 3 + i + 5) * 0.15,
          class: 'fade',
          style: `animation-delay:${pi * 0.06 + i * 0.08 + k * 0.012}s`
        });
        if (k % 5 === 4) {
          el(g, 'circle', {
            cx: x, cy: y + 16, r: 1.6, fill: FAINTDATA,
            class: 'fade',
            style: `animation-delay:${pi * 0.06 + i * 0.08 + k * 0.012}s`
          });
        }
      }

      const xEnd = zx + dir * n * PX;
      const labX = n === 0 ? zx + 10 : xEnd + dir * 10;
      const lab = txt(g, {
        x: labX, y: y + 3, 'font-size': 16, 'font-weight': 800, fill: ink,
        'text-anchor': dir < 0 && n > 0 ? 'end' : 'start',
        style: `paint-order:stroke;stroke:${PAPER};stroke-width:4px;animation-delay:${0.4 + pi * 0.06 + i * 0.08}s`,
        class: 'fade'
      }, fmt(est, panel.kind));
      tip(lab, `${panel.name} ${name} · ${fmt(est, panel.kind)} · 95% [${fmt(lo, panel.kind)}, ${fmt(hi, panel.kind)}]`);
    });
  });

  const bb = g.getBBox();
  const tx = (VW - bb.width) / 2 - bb.x;
  const ty = (VH - bb.height) / 2 - bb.y;
  g.setAttribute('transform', `translate(${tx},${ty})`);

})();
</script>
</body>
</html>
