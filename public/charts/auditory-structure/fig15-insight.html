<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Evaluate auditory mappings</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#FFFFFF}
  svg{width:100%;height:100%;display:block}
  svg text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 680 412" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">Not one measure. Not one conclusion.</title>
  <desc id="d">Evaluate auditory mappings splits into three questions. PERCEIVE: what is heard, 4.53 out of 5, Study 2. REQUIRE: what is needed, 3.42 out of 5, Study 2. CONSEQUENCE: what follows — error down, recovery up, success unchanged, Study 1 and 2.</desc>
  <rect width="680" height="412" fill="#FFFFFF"/>

  <text x="340" y="14" text-anchor="middle" font-size="12" font-weight="600" fill="#555555">Not one measure. Not one conclusion.</text>

  <rect x="70" y="24" width="540" height="48" rx="24" fill="#1BA3DC"/>
  <text x="340" y="54" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing=".06em">EVALUATE AUDITORY MAPPINGS</text>

  <line x1="340" y1="72" x2="340" y2="96" stroke="#1BA3DC" stroke-width="2.2"/>
  <line x1="114" y1="96" x2="566" y2="96" stroke="#1BA3DC" stroke-width="2.2"/>
  <line x1="114" y1="96" x2="114" y2="108" stroke="#1BA3DC" stroke-width="2.2"/>
  <line x1="340" y1="96" x2="340" y2="108" stroke="#1BA3DC" stroke-width="2.2"/>
  <line x1="566" y1="96" x2="566" y2="108" stroke="#1BA3DC" stroke-width="2.2"/>
  <polygon points="114,118 108,106 120,106" fill="#1BA3DC"/>
  <polygon points="340,118 334,106 346,106" fill="#1BA3DC"/>
  <polygon points="566,118 560,106 572,106" fill="#1BA3DC"/>

  <rect x="8" y="122" width="212" height="48" rx="12" fill="#D0E3FF"/>
  <text x="114" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#111111" letter-spacing=".08em">PERCEIVE</text>
  <rect x="234" y="122" width="212" height="48" rx="12" fill="#D0E3FF"/>
  <text x="340" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#111111" letter-spacing=".08em">REQUIRE</text>
  <rect x="460" y="122" width="212" height="48" rx="12" fill="#D0E3FF"/>
  <text x="566" y="152" text-anchor="middle" font-size="14" font-weight="800" fill="#111111" letter-spacing=".04em">CONSEQUENCE</text>

  <line x1="114" y1="170" x2="114" y2="188" stroke="#334EAC" stroke-width="2"/>
  <line x1="340" y1="170" x2="340" y2="188" stroke="#1BA3DC" stroke-width="2"/>
  <line x1="566" y1="170" x2="566" y2="188" stroke="#7096D1" stroke-width="2"/>
  <polygon points="114,198 108,186 120,186" fill="#334EAC"/>
  <polygon points="340,198 334,186 346,186" fill="#1BA3DC"/>
  <polygon points="566,198 560,186 572,186" fill="#7096D1"/>

  <rect x="8" y="202" width="212" height="202" rx="12" fill="#EEF5FC"/>
  <text x="114" y="228" text-anchor="middle" font-size="12" font-weight="800" fill="#111111">WHAT IS HEARD?</text>
  <text x="114" y="274" text-anchor="middle" font-size="26" font-weight="800" fill="#111111">4.53 / 5</text>
  <text x="114" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#666666">Study 2</text>
  <text x="114" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#334EAC">Can the encoding</text>
  <text x="114" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#334EAC">be heard?</text>

  <rect x="234" y="202" width="212" height="202" rx="12" fill="#EEF5FC"/>
  <text x="340" y="228" text-anchor="middle" font-size="12" font-weight="800" fill="#1BA3DC">WHAT IS NEEDED?</text>
  <text x="340" y="274" text-anchor="middle" font-size="26" font-weight="800" fill="#111111">3.42 / 5</text>
  <text x="340" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#666666">Study 2</text>
  <text x="340" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#1BA3DC">Is this the distinction</text>
  <text x="340" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#1BA3DC">the task requires?</text>

  <rect x="460" y="202" width="212" height="202" rx="12" fill="#EEF5FC"/>
  <text x="566" y="228" text-anchor="middle" font-size="12" font-weight="800" fill="#111111">WHAT FOLLOWS?</text>
  <text x="566" y="264" text-anchor="middle" font-size="16" font-weight="800" fill="#111111">Error  &#8595;</text>
  <text x="566" y="286" text-anchor="middle" font-size="16" font-weight="800" fill="#111111">Recovery  &#8593;</text>
  <text x="566" y="308" text-anchor="middle" font-size="16" font-weight="800" fill="#111111">Success  =</text>
  <text x="566" y="332" text-anchor="middle" font-size="13" font-weight="600" fill="#666666">Study 1 + 2</text>
  <text x="566" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#7096D1">Action, error,</text>
  <text x="566" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#7096D1">recovery, outcome</text>
</svg>
</body>
</html>
