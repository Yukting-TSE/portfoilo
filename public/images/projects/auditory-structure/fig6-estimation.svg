<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="430.0pt" height="266.0pt" viewBox="0 0 430.0 266.0" role="img" aria-labelledby="t d">
<title id="t">Every planned contrast as a mean difference with a 95% confidence interval</title>
<desc id="d">Four panels stacked vertically, one per outcome, each showing three horizontal interval bars for the planned contrasts C3 minus C2, C3 minus C1 and C2 minus C1, with a dashed vertical line at zero and the numeric mean, interval bounds, t statistic, p value and Cohen's dz printed to the right of every bar. Panel A, navigation error rate: all three intervals fall below zero, with C3 minus C2 at minus .146, interval minus .201 to minus .092, dz minus 1.29. Panel B, conditional correction rate on the 16 participants defined in every condition: C3 minus C2 is plus .168, interval .080 to .257, dz 1.02; C3 minus C1 is plus .177 with an interval that only just excludes zero; C2 minus C1 is essentially nil. Panel C, completion time, and panel D, NASA-TLX: every interval crosses zero and is wide, so those markers are unfilled.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="0.00" y="8.00" font-family="Helvetica, Arial, sans-serif" font-size="8.0" font-weight="700" fill="#000000" text-anchor="start">Paired mean differences with 95% confidence intervals</text>
<text x="0.00" y="17.00" font-family="Helvetica, Arial, sans-serif" font-size="5.8" font-weight="400" fill="#333333" text-anchor="start">Filled marker = interval excludes zero. Negative is fewer errors, faster, lower workload.</text>
